[project]
name = "undt"
version = "0.1.0"
description = "A Flask app with no routes. An LLM improvises every HTTP response."
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "flask>=3.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.70"]

[project.scripts]
undt = "undt.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["undt"]
